[package]
name = "a2_progress_test_portal"
version = "0.1.0"
edition = "2021"
description = "CEFR A2.1 Progress Test 2 practice portal with 3 reference tests and 10 newly developed tests"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
